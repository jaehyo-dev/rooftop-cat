[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, build/*, _site/*, assets/raw/*, assets/concept/*, assets/sprites/cat_concept_*, assets/sprites/cat_mascot_*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body{margin:0;overflow:hidden;background:#fbe9d4}#canvas{position:fixed;left:0;top:0;transform-origin:0 0}</style><script>/* 휴대폰을 세로로 들어도 게임을 90도 돌려 가로 화면으로 보여 준다 (터치 화면에서만). shortcut: 돌린 화면에서는 터치 좌표가 맞지 않음, 화면 어디든 누르면 점프라 지금은 괜찮고 버튼을 만들면 좌표 변환이 필요 */function rcFit(){var c=document.getElementById('canvas');if(!c)return;var w=innerWidth,h=innerHeight,d=devicePixelRatio||1;var p=h>w&&matchMedia('(pointer: coarse)').matches;var cw=p?h:w,ch=p?w:h;c.style.width=cw+'px';c.style.height=ch+'px';c.width=Math.round(cw*d);c.height=Math.round(ch*d);c.style.transform=p?'translateX('+w+'px) rotate(90deg)':'none';}addEventListener('DOMContentLoaded',rcFit);addEventListener('resize',rcFit);addEventListener('orientationchange',function(){setTimeout(rcFit,200)});</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
